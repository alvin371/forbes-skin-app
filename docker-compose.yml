version: '3.8'

services:
  # PHP Application with Apache
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Mount source code for development (hot reload)
      - .:/var/www/html
      # Persist sessions
      - ./application/cache/sessions:/var/www/html/application/cache/sessions
      # Persist logs
      - ./application/logs:/var/www/html/application/logs
      # Persist uploads
      - ./assets/uploads:/var/www/html/assets/uploads
    env_file:
      # Use your existing .env file for database connection
      - .env
    environment:
      # Override BASE_URL for local development
      - BASE_URL=http://localhost:8080/
      - CI_ENV=development
    networks:
      - hrms-network

  tiktok-worker:
    build:
      context: ./services/tiktok-worker-rust
      dockerfile: Dockerfile
    container_name: tiktok-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_API_BASE=http://app
      - WORKER_PORT=8081
    networks:
      - hrms-network

  # Long-lived endorse-refresh consumer. Drains endorse_refresh_queue continuously via
  # POST /api/endorse-refresh/{claim,result}. Set ENDORSE_REFRESH_DRIVER=rust so the PHP
  # cron stands down; flip back to 'cron' for instant rollback. Tiny footprint (Rust).
  endorse-refresh-worker:
    build:
      context: ./services/endorse-refresh-worker
      dockerfile: Dockerfile
    container_name: endorse-refresh-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_API_BASE=http://app
      - WORKER_PORT=8082
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hrms-network

networks:
  hrms-network:
    driver: bridge
