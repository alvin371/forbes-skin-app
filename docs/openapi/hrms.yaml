openapi: 3.0.3
info:
  title: Forbes Skin HRMS Mobile API
  version: 1.0.0
  description: |
    OpenAPI documentation for `application/controllers/Api_hrms.php`.

    Base path: `/api/hrms`

    This spec intentionally excludes the following routes because their controller methods are currently missing:
    - `/api/hrms/approvals/inbox`
    - `/api/hrms/approvals/inbox/count`
    - `/api/hrms/approvals/{id}/approve`
    - `/api/hrms/approvals/{id}/reject`
    - `/api/hrms/approvals/history`
servers:
  - url: /
    description: Relative base URL
  - url: https://acnenosystem.com/
    description: Production
security:
  - BearerAuth: []
tags:
  - name: Auth
  - name: Profile
  - name: PIN
  - name: Config
  - name: Attendance
  - name: Holidays
  - name: Upload
  - name: Leave
  - name: Performance
  - name: Overtime
paths:
  /api/hrms/auth/login:
    post:
      tags: [Auth]
      summary: Login and issue access/refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/hrms/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Refresh success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/hrms/profile:
    get:
      tags: [Profile]
      summary: Get authenticated user profile
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    patch:
      tags: [Profile]
      summary: Update profile fields
      description: Controller also accepts POST/PUT for this same route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/hrms/pin/setup:
    post:
      tags: [PIN]
      summary: Setup or replace 6-digit PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinSetupRequest'
      responses:
        '200':
          description: PIN configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/hrms/pin/verify:
    post:
      tags: [PIN]
      summary: Verify PIN, can return locked status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinVerifyRequest'
      responses:
        '200':
          description: PIN verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinVerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/hrms/pin/reset:
    post:
      tags: [PIN]
      summary: Reset PIN (requires password or admin role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinResetRequest'
      responses:
        '200':
          description: PIN reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/hrms/config:
    get:
      tags: [Config]
      summary: Get office configuration overrides
      responses:
        '200':
          description: Config payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hrms/attendance/office-proof:
    post:
      tags: [Attendance]
      summary: Validate WiFi office proof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeProofRequest'
      responses:
        '200':
          description: Proof result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hrms/attendance/check-in:
    post:
      tags: [Attendance]
      summary: Check in attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCheckRequest'
      responses:
        '200':
          description: Check-in saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCheckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/hrms/attendance/check-out:
    post:
      tags: [Attendance]
      summary: Check out attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCheckRequest'
      responses:
        '200':
          description: Check-out saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCheckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/hrms/attendance/history:
    get:
      tags: [Attendance]
      summary: Get attendance logs for current user
      responses:
        '200':
          description: Attendance history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/hrms/attendance/recap:
    get:
      tags: [Attendance]
      summary: Get monthly attendance recap for current user
      parameters:
        - $ref: '#/components/parameters/MonthParam'
      responses:
        '200':
          description: Recap summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecapSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/hrms/attendance/recap-all:
    get:
      tags: [Attendance]
      summary: Get monthly attendance recap for all users (HR/Admin)
      parameters:
        - $ref: '#/components/parameters/MonthParam'
      responses:
        '200':
          description: Recap summary list
          content:
            application/json:
              schema:
                type: object
                properties:
                  month:
                    type: string
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/AttendanceRecapSummary'
                        - type: object
                          properties:
                            user:
                              $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/hrms/attendance/report:
    get:
      tags: [Attendance]
      summary: Get monthly attendance report with daily details
      parameters:
        - $ref: '#/components/parameters/MonthParam'
      responses:
        '200':
          description: Full report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/hrms/holidays:
    get:
      tags: [Holidays]
      summary: Get holiday list
      parameters:
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
      responses:
        '200':
          description: Holiday list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HolidayItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/hrms/upload:
    post:
      tags: [Upload]
      summary: Upload leave/profile attachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type:
                  type: string
                  enum: [leave, profile]
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/hrms/leave:
    get:
      tags: [Leave]
      summary: List current user leave requests
      responses:
        '200':
          description: Leave list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaveItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Leave]
      summary: Create leave request (draft or submit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveCreateRequest'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/LeaveCreateRequest'
                - type: object
                  properties:
                    attachment:
                      type: string
                      format: binary
      responses:
        '201':
          description: Leave created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/hrms/leave/{id}:
    get:
      tags: [Leave]
      summary: Get leave detail
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Leave detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hrms/leave/{id}/submit:
    post:
      tags: [Leave]
      summary: Submit draft leave request into approval workflow
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: integer
                  status:
                    type: string
                  statusRaw:
                    type: string
                  workflow:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/hrms/leave/{id}/cancel:
    post:
      tags: [Leave]
      summary: Cancel leave request
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: integer
                  status:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/hrms/leave/{id}/progress:
    get:
      tags: [Leave]
      summary: Get leave approval progress
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Approval progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: integer
                  status:
                    type: string
                  statusRaw:
                    type: string
                  instance:
                    type: object
                    additionalProperties: true
                  currentStep:
                    type: integer
                  totalSteps:
                    type: integer
                  workflowStatus:
                    type: string
                  steps:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hrms/leave/quota:
    get:
      tags: [Leave]
      summary: Get leave quota summary and list
      responses:
        '200':
          description: Quota list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveQuotaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/hrms/leave/quota/detail:
    get:
      tags: [Leave]
      summary: Get quota detail per leave type
      parameters:
        - $ref: '#/components/parameters/LeaveTypeIdQueryParam'
      responses:
        '200':
          description: Quota detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveQuotaDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hrms/performance/templates/active:
    get:
      tags: [Performance]
      summary: Get active performance template by period and user role
      parameters:
        - $ref: '#/components/parameters/PeriodYearParam'
      responses:
        '200':
          description: Active template
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hrms/performance/submissions:
    get:
      tags: [Performance]
      summary: List current user performance submissions
      parameters:
        - $ref: '#/components/parameters/PeriodYearOptionalParam'
      responses:
        '200':
          description: Submission list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Performance]
      summary: Create performance submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceSubmissionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceSubmissionCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hrms/performance/submissions/{id}:
    get:
      tags: [Performance]
      summary: Get submission detail
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Submission detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hrms/performance/submissions/{id}/cancel:
    post:
      tags: [Performance]
      summary: Cancel submission
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: integer
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/hrms/overtime/types:
    get:
      tags: [Overtime]
      summary: Get active overtime types
      responses:
        '200':
          description: Types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        code:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        requiresAttachment:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/hrms/overtime:
    get:
      tags: [Overtime]
      summary: List current user overtime requests
      parameters:
        - $ref: '#/components/parameters/StatusParam'
        - $ref: '#/components/parameters/MonthParam'
      responses:
        '200':
          description: Overtime list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OvertimeListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Overtime]
      summary: Create overtime request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OvertimeCreateRequest'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/OvertimeCreateRequest'
                - type: object
                  properties:
                    attachment:
                      type: string
                      format: binary
      responses:
        '201':
          description: Overtime created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OvertimeCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/hrms/overtime/summary:
    get:
      tags: [Overtime]
      summary: Get overtime monthly summary
      parameters:
        - $ref: '#/components/parameters/MonthParam'
      responses:
        '200':
          description: Summary with request list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OvertimeSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/hrms/overtime/{id}:
    get:
      tags: [Overtime]
      summary: Get overtime request detail
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Overtime detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OvertimeDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/hrms/overtime/{id}/cancel:
    post:
      tags: [Overtime]
      summary: Cancel overtime request
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: integer
                  status:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/hrms/overtime/approvals/inbox:
    get:
      tags: [Overtime]
      summary: Get pending overtime approval inbox
      responses:
        '200':
          description: Inbox list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/hrms/overtime/approvals/inbox/count:
    get:
      tags: [Overtime]
      summary: Get pending overtime approval count
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/hrms/overtime/approvals/{stepId}/approve:
    post:
      tags: [Overtime]
      summary: Approve overtime step
      parameters:
        - $ref: '#/components/parameters/StepIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalActionRequest'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  isFinal:
                    type: boolean
                  nextStep:
                    type: integer
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/hrms/overtime/approvals/{stepId}/reject:
    post:
      tags: [Overtime]
      summary: Reject overtime step
      parameters:
        - $ref: '#/components/parameters/StepIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalActionRequest'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  isFinal:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/hrms/overtime/approvals/history:
    get:
      tags: [Overtime]
      summary: Get overtime approval history
      parameters:
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: History list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StepIdParam:
      name: stepId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MonthParam:
      name: month
      in: query
      required: false
      description: Month format `YYYY-MM`.
      schema:
        type: string
        pattern: '^\\d{4}-\\d{2}$'
    StartDateParam:
      name: start
      in: query
      required: false
      schema:
        type: string
        format: date
    EndDateParam:
      name: end
      in: query
      required: false
      schema:
        type: string
        format: date
    PeriodYearParam:
      name: period_year
      in: query
      required: true
      schema:
        type: integer
    PeriodYearOptionalParam:
      name: period_year
      in: query
      required: false
      schema:
        type: integer
    StatusParam:
      name: status
      in: query
      required: false
      schema:
        type: string
    LeaveTypeIdQueryParam:
      name: leave_type_id
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Method not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [status, message, code]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            errors:
              type: object
              additionalProperties:
                type: string

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        role_id:
          type: integer
          nullable: true
        role_name:
          type: string
          nullable: true

    AuthLoginRequest:
      type: object
