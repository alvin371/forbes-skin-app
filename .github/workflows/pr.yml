name: PR Checks

# Lint + tests run here, on the PR, before merge — off the deploy critical path.
# The post-merge push pipeline (ci.yml) only builds and deploys.

permissions:
  contents: read

env:
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Rust format
        run: cargo fmt --manifest-path services/endorse-refresh-worker/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path services/endorse-refresh-worker/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path services/endorse-refresh-worker/Cargo.toml

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build base image from this branch
        uses: docker/build-push-action@v6
        with:
          builder: default
          context: .
          file: Dockerfile.base
          load: true
          tags: local/forbes-base:ci

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          builder: default
          context: .
          target: ci
          load: true
          tags: local/forbes-ci:${{ github.sha }}
          build-args: BASE_IMAGE=local/forbes-base:ci

      - name: Validate composer.json
        run: docker run --rm local/forbes-ci:${{ github.sha }} composer validate

      - name: PHP syntax lint
        run: docker run --rm local/forbes-ci:${{ github.sha }} composer run lint:syntax

      - name: PHP CS Fixer
        run: docker run --rm local/forbes-ci:${{ github.sha }} composer run lint:style

      - name: PHPUnit
        run: docker run --rm local/forbes-ci:${{ github.sha }} composer test
