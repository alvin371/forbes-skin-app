name: Build Base Image

# Manual rebuild of the PHP base image. ci.yml builds it before the app on every push.

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  base:
    name: Build and push base image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            gilangp/forbes-base:latest
            gilangp/forbes-base:php-8.4.27
            gilangp/forbes-base:${{ github.sha }}
          cache-from: type=gha,scope=forbes-base
          cache-to: type=gha,mode=max,scope=forbes-base
