name: CI and Deploy

permissions:
  contents: read

env:
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

on:
  push:
    branches:
      - develop
      - main

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          load: true
          tags: local/forbes-ci:${{ github.sha }}
          cache-from: type=gha,scope=forbes-docker
          cache-to: type=gha,mode=max,scope=forbes-docker

      - name: Validate composer.json
        run: docker run --rm local/forbes-ci:${{ github.sha }} composer validate

      - name: PHP syntax lint
        run: docker run --rm local/forbes-ci:${{ github.sha }} composer run lint:syntax

      - name: PHP CS Fixer
        run: docker run --rm local/forbes-ci:${{ github.sha }} composer run lint:style

      - name: PHPUnit
        run: docker run --rm local/forbes-ci:${{ github.sha }} composer test

  build:
    name: Build and Smoke Test Runtime Image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: local/forbes-app:${{ github.sha }}
          cache-from: type=gha,scope=forbes-docker
          cache-to: type=gha,mode=max,scope=forbes-docker

      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --rm --name forbes-smoke -p 8080:80 local/forbes-app:${GITHUB_SHA}
          cleanup() {
            docker logs forbes-smoke || true
            docker rm -f forbes-smoke || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              docker inspect --format='{{json .State.Health}}' forbes-smoke || true
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            gilangp/forbes-app:${{ github.ref_name }}${{ steps.vars.outputs.short_sha }}
            gilangp/forbes-app:${{ github.ref_name }}
          cache-from: type=gha,scope=forbes-docker
          cache-to: type=gha,mode=max,scope=forbes-docker

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build

    container:
      image: gilangp/tools:ansible.2.13.10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Write Ansible inventory from secret
        run: echo "${{ secrets.ANSIBLE_HOSTS }}" > inventory.ini

      - name: Setup SSH key
        run: |
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Install required collections
        run: ansible-galaxy collection install community.docker:==3.10.0

      - name: Deploy with Ansible
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          ansible-playbook -i inventory.ini deploy/develop.yml --private-key key.pem -e "CI_COMMIT_SHORT_SHA=${GITHUB_SHA::8}"
