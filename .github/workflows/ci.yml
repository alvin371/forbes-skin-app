name: Build and Deploy

# Post-merge pipeline: build runtime image, smoke test, push, deploy.
# Lint + tests run on the PR (see pr.yml), so they're not repeated here.

permissions:
  contents: read

env:
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

on:
  push:
    branches:
      - develop
      - main

jobs:
  build:
    name: Build and Smoke Test Runtime Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: local/forbes-app:${{ github.sha }}
          cache-from: type=gha,scope=forbes-docker
          cache-to: type=gha,mode=max,scope=forbes-docker

      - name: Build endorse refresh worker image
        uses: docker/build-push-action@v6
        with:
          context: services/endorse-refresh-worker
          load: true
          tags: local/forbes-endorse-refresh-worker:${{ github.sha }}
          cache-from: type=gha,scope=forbes-endorse-refresh-worker
          cache-to: type=gha,mode=max,scope=forbes-endorse-refresh-worker

      # No --rm: a container that exits is removed instantly, taking its logs with it,
      # and the cleanup trap then reports only "No such container". Remove it ourselves.
      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name forbes-smoke -p 8080:80 local/forbes-app:${GITHUB_SHA}
          cleanup() {
            docker logs forbes-smoke || true
            docker inspect --format='exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}}' forbes-smoke || true
            docker rm -f forbes-smoke || true
          }
          trap cleanup EXIT

          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              docker inspect --format='{{json .State.Health}}' forbes-smoke || true
              exit 0
            fi
            # A dead container will never come back — stop polling and surface it.
            if [ "$(docker inspect -f '{{.State.Running}}' forbes-smoke 2>/dev/null)" != "true" ]; then
              echo "::error::forbes-smoke exited before serving /healthz"
              exit 1
            fi
            sleep 2
          done

          echo "::error::forbes-smoke never served /healthz within 30s"
          exit 1

      - name: Smoke test endorse refresh worker
        shell: bash
        run: |
          # APP_API_BASE points at the container's own closed port 9 on purpose: claim
          # fails, the worker logs a warning and backs off, and /health must stay up.
          docker run -d --name endorse-refresh-smoke \
            -p 18082:8082 \
            -e APP_API_BASE=http://127.0.0.1:9 \
            -e RUST_LOG=info \
            local/forbes-endorse-refresh-worker:${GITHUB_SHA}
          cleanup() {
            docker logs endorse-refresh-smoke || true
            docker inspect --format='exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}}' endorse-refresh-smoke || true
            docker rm -f endorse-refresh-smoke || true
          }
          trap cleanup EXIT

          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:18082/health; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' endorse-refresh-smoke 2>/dev/null)" != "true" ]; then
              echo "::error::worker exited before serving /health — check for a stub binary or a startup panic"
              exit 1
            fi
            sleep 2
          done

          echo "::error::worker never served /health within 30s"
          exit 1

      - name: Tag and push runtime image
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
        run: |
          docker tag local/forbes-app:${GITHUB_SHA} gilangp/forbes-app:${REF_NAME}${SHORT_SHA}
          docker tag local/forbes-app:${GITHUB_SHA} gilangp/forbes-app:${REF_NAME}
          docker push gilangp/forbes-app:${REF_NAME}${SHORT_SHA}
          docker push gilangp/forbes-app:${REF_NAME}

          docker tag local/forbes-endorse-refresh-worker:${GITHUB_SHA} gilangp/forbes-endorse-refresh-worker:${REF_NAME}${SHORT_SHA}
          docker tag local/forbes-endorse-refresh-worker:${GITHUB_SHA} gilangp/forbes-endorse-refresh-worker:${REF_NAME}
          docker push gilangp/forbes-endorse-refresh-worker:${REF_NAME}${SHORT_SHA}
          docker push gilangp/forbes-endorse-refresh-worker:${REF_NAME}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build

    container:
      image: gilangp/tools:ansible.2.13.10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Write Ansible inventory from secret
        run: echo "${{ secrets.ANSIBLE_HOSTS }}" > inventory.ini

      - name: Setup SSH key
        run: |
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Install required collections
        run: ansible-galaxy collection install community.docker:==3.10.0

      - name: Deploy with Ansible
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          ansible-playbook -i inventory.ini deploy/develop.yml --private-key key.pem -e "CI_COMMIT_SHORT_SHA=${GITHUB_SHA::8}"
